services:
  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: aha-discord-bot
    restart: unless-stopped
    env_file:
      - ./discord-bot/.env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
