services:
  aha-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aha-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # Set logging limits so container logs don't fill up host disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
